name: Engineering gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: engineering-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changed scopes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      adapters: ${{ steps.filter.outputs.adapters }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - '01_app/**'
              - '03_migrations/**'
              - '05_scripts/check-fast.ps1'
              - '05_scripts/check-full.ps1'
            adapters:
              - '08_adapters/**'
              - '05_scripts/check-fast.ps1'
              - '05_scripts/check-full.ps1'

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./01_app -> target
      - name: Run full Rust checks
        shell: pwsh
        run: ./05_scripts/check-full.ps1 -Scope Rust

  adapters:
    name: TypeScript and Python adapters
    needs: changes
    if: needs.changes.outputs.adapters == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./08_adapters/01_browser_extension/package-lock.json
      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install TypeScript dependencies
        working-directory: ./08_adapters/01_browser_extension
        run: npm ci
      - name: Run full adapter checks
        shell: pwsh
        run: ./05_scripts/check-full.ps1 -Scope Adapters

  architecture:
    name: Architecture and docs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install architecture check dependencies
        shell: pwsh
        run: choco install ripgrep sqlite --no-progress --yes
      - name: Run architecture and document boundary checks
        shell: pwsh
        run: ./05_scripts/check-boundary.ps1
