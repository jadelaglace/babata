name: Engineering gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: engineering-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - name: Run full Rust checks
        shell: pwsh
        run: ./05_scripts/check-full.ps1 -Scope Rust

  adapters:
    name: TypeScript and Python adapters
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./08_adapters/01_browser_extension/package-lock.json
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TypeScript dependencies
        working-directory: ./08_adapters/01_browser_extension
        run: npm ci
      - name: Run full adapter checks
        shell: pwsh
        run: ./05_scripts/check-full.ps1 -Scope Adapters

  architecture:
    name: Architecture and docs
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install architecture check dependencies
        shell: pwsh
        run: choco install ripgrep --no-progress --yes
      - name: Run architecture and document boundary checks
        shell: pwsh
        run: ./05_scripts/check-boundary.ps1
