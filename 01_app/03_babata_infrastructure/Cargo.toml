[package]
name = "babata-infrastructure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
aes = "0.8"
babata-domain = { path = "../01_babata_domain" }
babata-application = { path = "../02_babata_application" }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
hmac = "0.12"
lopdf = { version = "0.38", default-features = false }
mailparse = "0.16"
md-5 = "0.10"
mime_guess = "2.0"
quick-xml = { version = "0.38", features = ["serialize"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.16"
